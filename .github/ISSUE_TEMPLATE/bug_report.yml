name: Bug report
description: Report broken behavior or a regression
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps, tool call, or command that triggers the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error output or logs without tokens or secrets.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Bun version, MCP client"
    validations:
      required: true
