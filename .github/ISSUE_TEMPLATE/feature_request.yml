name: Feature request
description: Propose a new MCP tool, module, or workflow change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What breaks or feels slow without this change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Tool name, inputs, outputs, and any security boundary to enforce.
    validations:
      required: true
